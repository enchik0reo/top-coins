syntax = "proto3";

package coininfo;

import "google/protobuf/timestamp.proto";

option go_package = "pkg/api/proto/v1;coin_infov1";

service CoinInfoService {
  rpc GetCoinLastInfo (GetCoinLastInfoRequest) returns (GetCoinLastInfoResponse);
  rpc GetCoinHistory (GetCoinHistoryRequest) returns (GetCoinHistoryResponse);
}

message Coin {
  uint64 id = 1;
  string request_id = 2;
  string name = 3;
  uint64 price = 4;
  string currency = 5;
  string source = 6;
  google.protobuf.Timestamp request_time = 7;
}

message GetCoinLastInfoRequest {
  string name = 1;
}

message GetCoinLastInfoResponse {
  Coin coin = 1;
}

message GetCoinHistoryRequest {
  string name = 1;
  google.protobuf.Timestamp since_time = 2;
}

message GetCoinHistoryResponse {
  repeated Coin history = 1;
}
