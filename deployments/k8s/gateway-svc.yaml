apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  ENVIRONMENT: "debug"
  CTX_TIMEOUT: "20s"
  API_SERVER_ADDRESS: "0.0.0.0:8080"
  API_SERVER_TIMEOUT: "5s"
  API_SERVER_IDLE_TIMEOUT: "90s"
  API_ALLOW_DOMAINS: "*"
  GRPC_ADDRESS: "processor-svc:50051"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: crypto-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
